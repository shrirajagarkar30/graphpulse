<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GraphPulse-R</title>
  <meta name="description" content="GraphPulse-R keeps shortest paths and a delivery tour exactly correct as roads close, by repairing the previous solution instead of recomputing everything.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141414'/%3E%3Cpath d='M6 22 L13 22 L13 10 L26 10' fill='none' stroke='%23ffffff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    /* Apply theme, density and sidebar preference before first paint (no flash). */
    (function () {
      var d = document.documentElement;
      d.classList.remove('no-js');
      try {
        var s = JSON.parse(localStorage.getItem('gp.settings') || '{}');
        var theme = s.theme || 'system';
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        d.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (s.motion === 'reduced') d.setAttribute('data-motion', 'reduced');
        var sb = localStorage.getItem('gp.sidebar');
        if (sb === 'collapsed' || (!sb && window.innerWidth <= 1100)) d.setAttribute('data-sidebar', 'collapsed');
      } catch (e) { d.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <!-- Loader: a route draws itself, then the page appears -->
  <div id="loader" role="status" aria-live="polite" aria-label="Loading GraphPulse-R">
    <div class="loader-inner">
      <svg class="loader-mark" viewBox="0 0 120 72" aria-hidden="true">
        <path class="route" d="M10 60 H50 V12 H110"/>
        <circle class="node" cx="10" cy="60" r="7"/>
        <circle class="node" cx="50" cy="60" r="7"/>
        <circle class="node" cx="50" cy="12" r="7"/>
        <circle class="node" cx="110" cy="12" r="7"/>
      </svg>
      <div class="loader-word">GraphPulse-R</div>
    </div>
  </div>

  <!-- Landing page: instantiated from the template only on the landing route -->
  <div id="landing" hidden></div>
  <template id="landing-tpl">
    <header class="l-nav">
      <a class="brand" href="#/" aria-label="GraphPulse-R home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="currentColor"/><path d="M5 16.5h5V7.5h9" fill="none" stroke="var(--ground)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand-name">GraphPulse-R</span>
      </a>
      <nav class="l-links" aria-label="Page sections">
        <a href="#how" data-scroll="how">How it decides</a>
        <a href="#guarantees" data-scroll="guarantees">Guarantees</a>
        <a href="#questions" data-scroll="questions">Questions</a>
      </nav>
      <button class="btn btn-ghost btn-icon" type="button" data-theme-cycle aria-label="Change theme"><svg class="icon"><use href="#i-sun"/></svg></button>
      <a class="btn btn-primary keep" href="#/overview">Get started</a>
    </header>

    <main>
      <section class="l-hero" id="top">
        <div class="l-hero-copy">
          <h1 class="l-h1"><span>Routes that stay right</span><span>when roads change.</span></h1>
          <p class="l-lede">GraphPulse-R repairs shortest paths and the delivery tour after each closure instead of recomputing everything, and it can prove when nothing needs to change.</p>
          <div class="l-actions">
            <a class="btn btn-primary btn-lg" href="#/overview">Get started</a>
            <a class="link-btn" href="#how" data-scroll="how">How it decides</a>
          </div>
        </div>
        <div class="l-motif" aria-hidden="true">
          <svg viewBox="0 0 640 560" focusable="false">
            <path class="motif-closed" d="M300 108 h120 v34 h-120 z"/>
            <path class="motif-route" d="M40 480 H220 V125 H300"/>
            <path class="motif-detour" d="M300 125 V330 H520 V125 H640"/>
            <circle class="motif-node" cx="40" cy="480" r="26"/>
            <circle class="motif-node" cx="220" cy="125" r="26"/>
            <circle class="motif-node" cx="300" cy="125" r="26"/>
            <circle class="motif-node" cx="520" cy="330" r="26"/>
          </svg>
        </div>
      </section>

      <section class="l-section l-band" id="how">
        <h2 class="l-h2 reveal">Most closures change nothing.</h2>
        <p class="l-lead reveal">The engine knows which ones, and proves it before it does any work.</p>
        <div class="l-two">
          <div class="l-block reveal">
            <h3>First, a check that costs one step.</h3>
            <p>If the closed road was on no shortest path, no distance changes. One operation, and the answer is already correct.</p>
          </div>
          <div class="l-block reveal">
            <h3>Then, a second way in.</h3>
            <p>If the road was on a shortest path but its destination has another equally short road, only a counter and a pointer change.</p>
          </div>
          <div class="l-block reveal">
            <h3>Otherwise, repair what broke.</h3>
            <p>The engine finds the places whose distance really changes and recomputes just those, under a work budget set from the cost of a full rebuild.</p>
          </div>
          <div class="l-block reveal">
            <h3>If repair costs too much, rebuild.</h3>
            <p>When the budget runs out the repair is discarded at no cost and the tree is rebuilt from scratch, so the work per update stays bounded.</p>
          </div>
        </div>
        <p class="l-wide reveal">The delivery tour has its own certificate. If no road the current tour uses got worse, that tour is still the best one, and the exact solver is skipped.</p>
      </section>

      <section class="l-section" id="live">
        <div class="l-live">
          <div class="reveal">
            <h2 class="l-h2">Watch a closure being resolved.</h2>
            <p>These panels are the running engine, not a mock-up. Run a sample scenario to close and slow some roads and see the decisions, the tour and the work saved.</p>
            <div class="l-actions" style="margin-top:28px">
              <button class="btn btn-primary" type="button" id="landing-run" data-busy="Running scenario">Run a sample scenario</button>
              <a class="link-btn" href="#/network">Open the network</a>
            </div>
          </div>
          <div class="l-fragment reveal" data-ui>
            <div class="graph-stage" id="landing-stage"><div class="stage-msg" id="landing-stage-msg">Connecting to the engine…</div><canvas id="landing-canvas" aria-label="Small road network with the current shortest-path tree" role="img"></canvas></div>
          </div>
        </div>
        <div class="l-frags">
          <div class="l-fragment l-frag reveal" data-ui id="frag-decision" aria-live="polite"></div>
          <div class="l-fragment l-frag reveal" data-ui id="frag-tour" aria-live="polite"></div>
          <div class="l-fragment l-frag reveal" data-ui id="frag-chart" aria-live="polite"></div>
        </div>
      </section>

      <section class="l-section l-band" id="guarantees">
        <h2 class="l-h2 reveal">What is proved, and what is only measured.</h2>
        <div class="l-stmts">
          <p class="l-stmt reveal"><b>Proved.</b> With an exact estimate of the rebuild cost F, one update costs at most (1 + c) · F + 2 operations, and the competitive ratio against the cheaper of repair and rebuild is max(1 + c, (1 + c) / c), smallest at c = 1. The proofs are drafted and await independent review.</p>
          <p class="l-stmt reveal"><b>Checked.</b> After every update the results were compared with recomputing everything from scratch, across a very large number of random updates on four graph families, for the single-source layer, the multi-terminal layer and the full routing pipeline.</p>
          <p class="l-stmt reveal"><b>Measured, with limits.</b> Every experiment uses synthetic graphs and pure Python. No real road network was evaluated, and on easy workloads the plain repair-only strategy can be slightly cheaper than the budgeted one.</p>
        </div>
      </section>

      <section class="l-section" id="questions">
        <div class="l-q"><h2 class="l-h2 reveal">Questions</h2>
        <div class="l-faq">
          <details class="reveal"><summary>Does it use real road data?</summary><p>No. Every experiment uses synthetic graphs. A loader for DIMACS road files exists and is tested on a small file, but no real dataset was used.</p></details>
          <details class="reveal"><summary>Is the tour always optimal?</summary><p>Yes, for up to eighteen stops: the tour is solved exactly whenever the certificate cannot prove the previous tour is still optimal. Larger fleets are outside the project's scope.</p></details>
          <details class="reveal"><summary>Which changes are supported?</summary><p>Road closures and slowdowns, that is, weights that only increase. Reopening roads and adding roads are not supported.</p></details>
          <details class="reveal"><summary>Why not just recompute everything?</summary><p>You can; it is the baseline every result is compared with. The point is to do less work while giving exactly the same answer.</p></details>
        </div></div>
      </section>

      <section class="l-section l-cta">
        <h2 class="l-h2 reveal">Close a road and see what changes.</h2>
        <a class="btn btn-lg" href="#/overview">Get started</a>
      </section>
    </main>

    <footer class="l-foot">
      <div class="l-foot-name" aria-hidden="true">GraphPulse-R</div>
      <div class="l-foot-meta">
        <span>Course project for Design and Analysis of Algorithms.</span>
        <a href="https://github.com/shrirajagarkar30/graphpulse" rel="noopener">Source and documentation</a>
        <span id="landing-version"></span>
      </div>
    </footer>
  </template>

  <!-- Application -->
  <div id="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="sidebar-head">
        <button class="sb-toggle" type="button" id="sb-toggle" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="sidebar-nav"><svg class="icon icon-lg"><use href="#i-panel"/></svg></button>
        <a class="brand" href="#/overview" aria-label="GraphPulse-R overview">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="currentColor"/><path d="M5 16.5h5V7.5h9" fill="none" stroke="var(--ground)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="brand-name">GraphPulse-R</span>
        </a>
      </div>
      <div class="scope" id="scope" aria-live="polite"></div>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Sections"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <div class="main">
      <div class="mobile-bar">
        <button class="btn btn-ghost btn-icon" type="button" id="mobile-menu" aria-label="Open navigation"><svg class="icon icon-lg"><use href="#i-menu"/></svg></button>
        <span class="title" id="mobile-title">GraphPulse-R</span>
      </div>
      <main id="view" class="page" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">GraphPulse-R needs JavaScript to run the dashboard.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
